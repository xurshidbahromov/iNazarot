<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .icon-i { fill: #1e293b; }
    .icon-chevron { stroke: #20c997; }
    @media (prefers-color-scheme: dark) {
      .icon-i { fill: #f1f5f9; }
    }
  </style>

  <!-- Modern letter 'i' -->
  <circle cx="10" cy="9.5" r="2" class="icon-i" />
  <rect x="8" y="14" width="4" height="10" rx="1.5" class="icon-i" />
  
  <!-- Double chevron growth arrows (Elevate logo style - shifted up) -->
  <path d="M22 6h4v4" class="icon-chevron" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M17 11h4v4" class="icon-chevron" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>