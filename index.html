<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iNazorat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Anti-FOUC: Apply saved theme before first paint
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('inazorat-theme') || '{}');
          var theme = (stored.state && stored.state.theme) || 'system';
          
          if (theme === 'system') {
            var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.add(isDark ? 'dark' : 'light');
          } else {
            document.documentElement.classList.add(theme);
          }
        } catch(e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
